# Fixture config for the tmux-agent-picker suites: the man page's example
# predicates, plus the acknowledgement hooks a config pairs them with (a
# visit clears a done mark and its exit status; waiting and blocked stay).
# @attention_panes is prefix a's list in the dotfiles config, which the
# picker's red, yellow and green rows must match. test/tmux-tools-test checks
# that every line of the man page example is here.
set -g focus-events on
set -g @agent_names 'claude|codex|gemini|grok|muse|opencode'
set -g @pane_agent '#{m/r:^(#{@agent_names})$,#{pane_current_command}}'
set -g @pane_marked_failed '#{&&:#{@term_notify_pending},#{||:#{==:#{@term_notify_pending},blocked},#{>:#{@term_notify_exit_status},0}}}'
set -g @child_failed '#{m/r:^[0-9]+:[0-9]+:[0-9]+:[1-9][0-9]*$,#{@termnav_child_attention}}'
set -g @pane_jump_failed '#{||:#{E:@pane_marked_failed},#{E:@child_failed}}'
set -g @pane_jump_waiting '#{&&:#{!=:#{E:@pane_jump_failed},1},#{==:#{@term_notify_pending},waiting}}'
set -g @pane_jump_done '#{&&:#{!=:#{E:@pane_jump_failed},1},#{&&:#{!=:#{E:@pane_jump_waiting},1},#{@term_notify_pending}}}'
set -g @pane_jump_working '#{@term_busy}'
set -g @session_name_glob '#{s/([][*?\\])/\\\1/:session_name}'
set -g @window_counted '#{||:#{==:#{window_linked_sessions_list},#{session_name}},#{m:#{E:@session_name_glob}#,*,#{window_linked_sessions_list}}}'
set -g @pane_label '#{pane_current_command}#{?#{!=:#{pane_title},#{host}}, · #{q/h:pane_title},}'
set -g @pane_has_marks '#{||:#{@term_notify_pending},#{@termnav_child_attention}}'
set -g @attention_entry ':#{window_id}.#{pane_id} '
set -g @attention_panes '#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_failed},#{E:@attention_entry},},}},}}}#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_waiting},#{E:@attention_entry},},}},}}}#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_done},#{E:@attention_entry},},}},}}}'
set-hook -g pane-focus-in[100] "if-shell -F '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}' '' 'set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status'"
set-hook -g pane-focus-out[100] "if-shell -F '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}' '' 'set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status'"
set-hook -g after-select-pane[100] "if-shell -F '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}' '' 'set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status'"
set-hook -g after-select-window[100] "if-shell -F '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}' '' 'set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status'"
set-hook -g client-session-changed[100] "if-shell -F '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}' '' 'set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status'"
