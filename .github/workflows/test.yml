name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@3b726ff80de78ae9407dc1f609c11d951c56bd3b
    with:
      matrix-set: full
      profiles: base,tmux
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: TMUX_TOOLS_REQUIRE_TMUX=1 TMUX_TOOLS_SKIP_SHELLCHECK=1 test/run

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Exercise installed commands with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          install_prefix="$RUNNER_TEMP/tmux-tools-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh

          for command in tmux-clip-paste tmux-continuum-default-server \
            tmux-continuum-save-gate tmux-copy-last-output term-pane-mark \
            term-notify-sound; do
            [[ -L "$install_prefix/bin/$command" ]] || exit 1
            /bin/bash -n "$install_prefix/bin/$command"
          done
          /bin/bash "$install_prefix/bin/tmux-clip-paste" --help >/dev/null
          TMUX= /bin/bash "$install_prefix/bin/tmux-continuum-default-server"
          /bin/bash "$install_prefix/bin/tmux-continuum-save-gate"

          # The pane commands talk to tmux, so give them a stub that serves a
          # fixed pane capture and logs every other call. Run each command
          # with /bin/bash: its env-bash shebang would pick PATH's bash.
          # Bash 3.2's errexit ignores a failed [[ ]], so each check exits
          # explicitly.
          stub_dir="$RUNNER_TEMP/tmux-stub"
          mkdir -p "$stub_dir"
          printf '%s\n' '#!/bin/sh' \
            'case $1 in' \
            '  capture-pane) cat "$STUB_CAPTURE" ;;' \
            '  *) printf "%s\n" "$*" >>"$STUB_LOG" ;;' \
            'esac' >"$stub_dir/tmux"
          chmod +x "$stub_dir/tmux"
          export STUB_CAPTURE="$stub_dir/capture" STUB_LOG="$stub_dir/log"

          printf '%s\n' '[0] me@host:~' '$ echo hi' 'hi' '[0] me@host:~' '$' \
            >"$STUB_CAPTURE"
          output=$(PATH="$stub_dir:$PATH" \
            /bin/bash "$install_prefix/bin/tmux-copy-last-output" --print)
          [[ $output == $'$ echo hi\nhi' ]] || exit 1
          : >"$STUB_CAPTURE"
          status=0
          PATH="$stub_dir:$PATH" /bin/bash \
            "$install_prefix/bin/tmux-copy-last-output" --print || status=$?
          [[ $status -eq 3 ]] || exit 1

          status=0
          /bin/bash "$install_prefix/bin/term-pane-mark" 2>/dev/null ||
            status=$?
          [[ $status -eq 64 ]] || exit 1
          : >"$STUB_LOG"
          PATH="$stub_dir:$PATH" TMUX=/tmp/stub,1,0 TMUX_PANE=%7 \
            TERM_PROGRAM=tmux /bin/bash "$install_prefix/bin/term-pane-mark" \
            set busy
          grep -qx 'set-option -p -t %7 @term_busy 1' "$STUB_LOG"

          bell="$RUNNER_TEMP/bell"
          PATH="$stub_dir:$PATH" TMUX= TMUX_PANE= TERM_NOTIFY_TTY="$bell" \
            /bin/bash "$install_prefix/bin/term-notify-sound"
          [[ $(cat "$bell") == $'\a' ]] || exit 1

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
    steps:
      - name: Require all tmux-tools compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"

          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@3b726ff80de78ae9407dc1f609c11d951c56bd3b
