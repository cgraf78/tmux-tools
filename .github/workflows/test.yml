name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@36d1bb6a8070d9dc7dfc85e1d21b2fe9b3721450
    with:
      matrix-set: full
      profiles: base,tmux-pinned,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: TMUX_TOOLS_REQUIRE_TMUX=1 TMUX_TOOLS_SKIP_SHELLCHECK=1 test/run
      termux-profiles: base,tmux,python

  tmux-floor:
    name: tmux compatibility floor / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the exact tmux floor
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@36d1bb6a8070d9dc7dfc85e1d21b2fe9b3721450
        with:
          matrix-name: Ubuntu
          profiles: python,tmux-floor-exact
      - name: Exercise real panes and clients at the supported floor
        env:
          TMUX_TOOLS_REQUIRE_TMUX: "1"
          TMUX_TOOLS_SKIP_SHELLCHECK: "1"
        run: test/run --tmux-floor-smoke

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Exercise installed commands with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          install_prefix="$RUNNER_TEMP/tmux-tools-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh

          for command in tmux-clip-paste tmux-continuum-default-server \
            tmux-continuum-save-gate tmux-copy-last-output \
            tmux-command-palette tmux-agent-picker tmux-pane term-pane-mark \
            term-notify-sound term-pane-state; do
            [[ -L "$install_prefix/bin/$command" ]] || exit 1
            /bin/bash -n "$install_prefix/bin/$command"
          done
          /bin/bash "$install_prefix/bin/tmux-clip-paste" --help >/dev/null
          /bin/bash "$install_prefix/bin/tmux-pane" --help >/dev/null
          TMUX= /bin/bash "$install_prefix/bin/tmux-continuum-default-server"
          /bin/bash "$install_prefix/bin/tmux-continuum-save-gate"

          # The pane commands talk to tmux, so give them a stub that serves a
          # fixed pane capture and logs every other call. It reports
          # STUB_VERSION as #{version}, by default nothing, which counts as
          # newest, alone or ahead of a chained command (display-message -p
          # '#{version}' \; capture-pane ...). Run each command with
          # /bin/bash: its env-bash shebang would pick PATH's bash. Bash 3.2's
          # errexit ignores a failed [[ ]], so each check exits explicitly.
          stub_dir="$RUNNER_TEMP/tmux-stub"
          mkdir -p "$stub_dir"
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1 ${2-} ${3-}" = "display-message -p #{version}" ]; then' \
            '  printf "%s\n" "${STUB_VERSION-}"' \
            '  [ "${4-}" = ";" ] || exit 0' \
            '  shift 4' \
            'fi' \
            'case $1 in' \
            '  capture-pane) cat "$STUB_CAPTURE" ;;' \
            '  display-message) printf "%s\n" "$*" >>"$STUB_LOG" ;;' \
            '  list-keys) [ "$4" != prefix ] || printf "%s\n" "r  Record the pane" ;;' \
            '  *) printf "%s\n" "$*" >>"$STUB_LOG" ;;' \
            'esac' >"$stub_dir/tmux"
          chmod +x "$stub_dir/tmux"
          export STUB_CAPTURE="$stub_dir/capture" STUB_LOG="$stub_dir/log"

          printf '%s\n' '[0] me@host:~' '$ echo hi' 'hi' '[0] me@host:~' '$' \
            >"$STUB_CAPTURE"
          output=$(PATH="$stub_dir:$PATH" \
            /bin/bash "$install_prefix/bin/tmux-copy-last-output" --print)
          [[ $output == $'$ echo hi\nhi' ]] || exit 1
          : >"$STUB_CAPTURE"
          status=0
          PATH="$stub_dir:$PATH" /bin/bash \
            "$install_prefix/bin/tmux-copy-last-output" --print || status=$?
          [[ $status -eq 3 ]] || exit 1
          # An older server is refused before its capture is used.
          status=0
          STUB_VERSION=3.2a PATH="$stub_dir:$PATH" /bin/bash \
            "$install_prefix/bin/tmux-copy-last-output" --print 2>/dev/null ||
            status=$?
          [[ $status -eq 1 ]] || exit 1

          # Each mark change ends with the opt-in background publish.
          publish=" ; if-shell -F -t %7 #{&&:#{==:#{@term_pane_state_publish},on},#{session_attached}} run-shell -b -t %7 'term-pane-state --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1 || true'"
          status=0
          /bin/bash "$install_prefix/bin/term-pane-mark" 2>/dev/null ||
            status=$?
          [[ $status -eq 64 ]] || exit 1
          : >"$STUB_LOG"
          PATH="$stub_dir:$PATH" TMUX=/tmp/stub,1,0 TMUX_PANE=%7 \
            TERM_PROGRAM=tmux /bin/bash "$install_prefix/bin/term-pane-mark" \
            set busy
          grep -qxF "set-option -pu -t %7 @term_busy_token ; set-option -p -t %7 @term_busy 1 ; set-option -pF -t %7 @term_busy_seq #{e|+:#{?@term_busy_seq,#{@term_busy_seq},0},1}$publish" "$STUB_LOG"
          : >"$STUB_LOG"
          PATH="$stub_dir:$PATH" /bin/bash "$install_prefix/bin/term-pane-mark" \
            set pending --kind waiting --pane %7
          grep -qxF "set-option -pu -t %7 @term_notify_exit_status ; set-option -p -t %7 @term_notify_pending waiting$publish" "$STUB_LOG"
          : >"$STUB_LOG"
          PATH="$stub_dir:$PATH" /bin/bash "$install_prefix/bin/term-pane-mark" \
            clear pending --if sticky --pane %7
          grep -qxF "if-shell -F -t %7 #{||:#{==:#{@term_notify_pending},waiting},#{==:#{@term_notify_pending},blocked}} set-option -pu -t %7 @term_notify_pending ; set-option -pu -t %7 @term_notify_exit_status $publish" "$STUB_LOG"
          status=0
          /bin/bash "$install_prefix/bin/term-pane-mark" set pending \
            --kind waiting --exit-status 1 --pane %7 2>/dev/null || status=$?
          [[ $status -eq 64 ]] || exit 1

          output=$(PATH="$stub_dir:$PATH" /bin/bash \
            "$install_prefix/bin/tmux-command-palette" --list)
          [[ $output == $'Record the pane   prefix r\tprefix\tr' ]] || exit 1
          status=0
          /bin/bash "$install_prefix/bin/tmux-command-palette" 2>/dev/null ||
            status=$?
          [[ $status -eq 64 ]] || exit 1

          # The picker's rows come from its mock suite below, which runs
          # every awk it finds, /usr/bin/awk among them.
          status=0
          /bin/bash "$install_prefix/bin/tmux-agent-picker" --list \
            2>/dev/null || status=$?
          [[ $status -eq 64 ]] || exit 1

          /bin/bash test/term-pane-state-test
          /bin/bash test/tmux-agent-picker-test

          bell="$RUNNER_TEMP/bell"
          bell_log="$RUNNER_TEMP/bell-log/calls.log"
          PATH="$stub_dir:$PATH" TMUX= TMUX_PANE= TERM_NOTIFY_TTY="$bell" \
            TERM_NOTIFY_LOG="$bell_log" \
            /bin/bash "$install_prefix/bin/term-notify-sound" 2>"$RUNNER_TEMP/bell.err"
          [[ $(cat "$bell") == $'\a' ]] || exit 1
          [[ ! -s "$RUNNER_TEMP/bell.err" ]] || exit 1

          # The call log walks ancestors with BSD ps here, and the audit
          # reads it with BSD awk, sort and date under Bash 3.2.
          IFS=$'\t' read -r _ _ route _ _ _ _ _ chain _ <"$bell_log"
          [[ $route == tty && -n $chain && $chain != - ]] || exit 1
          TERM_NOTIFY_LOG="$bell_log" /bin/bash \
            "$install_prefix/bin/term-notify-sound" --audit >"$RUNNER_TEMP/audit"
          grep -q '^term-notify-sound: 1 calls in the last 60 minutes' \
            "$RUNNER_TEMP/audit" || exit 1
          [[ $(TERM_NOTIFY_LOG="$bell_log" /bin/bash \
            "$install_prefix/bin/term-notify-sound" --audit --raw | wc -l) -eq 1 ]] ||
            exit 1

      - name: Install pinned tmux
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@36d1bb6a8070d9dc7dfc85e1d21b2fe9b3721450
        with:
          matrix-name: macOS
          profiles: tmux-pinned

      - name: Smoke-test the agent picker with the real fzf
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |-
          brew install fzf
          TMUX_TOOLS_REQUIRE_TMUX=1 TMUX_TOOLS_REQUIRE_FZF=1 \
            python3 test/tmux-agent-picker-fzf.py

      # Both suites start private servers, so they run after the shared tmux
      # install. The tmux-pane suite starts the tool itself with "$BASH".
      - name: Exercise real tmux with stock macOS Bash
        shell: /bin/bash {0}
        env:
          TMUX_TOOLS_REQUIRE_TMUX: "1"
        run: |-
          set -euo pipefail
          test "$(command -v tmux)" = "$CI_TMUX_PINNED_BIN"
          tmux -V
          /bin/bash test/tmux-pane-test
          /bin/bash test/term-pane-mark-token-test

  fzf:
    name: Real fzf (Ubuntu)
    runs-on: ubuntu-24.04
    # The shared platform matrix installs no fzf, so the real-fzf picker test
    # would skip there. This job installs it and makes the skip a failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Install pinned tmux
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@36d1bb6a8070d9dc7dfc85e1d21b2fe9b3721450
        with:
          matrix-name: Ubuntu
          profiles: tmux-pinned

      - name: Install fzf
        timeout-minutes: 10
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fzf python3

      - name: Smoke-test the agent picker with the real fzf
        run: |-
          TMUX_TOOLS_REQUIRE_TMUX=1 TMUX_TOOLS_REQUIRE_FZF=1 \
            python3 test/tmux-agent-picker-fzf.py

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, tmux-floor, macos-bash32, fzf]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      TMUX_FLOOR_RESULT: ${{ needs.tmux-floor.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
      FZF_RESULT: ${{ needs.fzf.result }}
    steps:
      - name: Require all tmux-tools compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'tmux compatibility floor: %s\n' "$TMUX_FLOOR_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"
          printf 'Real fzf: %s\n' "$FZF_RESULT"

          test "$SHELL_RESULT" = success
          test "$TMUX_FLOOR_RESULT" = success
          test "$BASH32_RESULT" = success
          test "$FZF_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@36d1bb6a8070d9dc7dfc85e1d21b2fe9b3721450
