name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      matrix-set: full
      profiles: base,tmux
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: TMUX_TOOLS_REQUIRE_TMUX=1 TMUX_TOOLS_SKIP_SHELLCHECK=1 test/run

  macos-bash32:
    name: Stock macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise installed commands with stock macOS Bash
        shell: /bin/bash {0}
        run: |-
          set -euo pipefail
          [[ ${BASH_VERSINFO[0]} -eq 3 && ${BASH_VERSINFO[1]} -eq 2 ]]

          install_prefix="$RUNNER_TEMP/tmux-tools-bash32"
          PREFIX="$install_prefix" /bin/bash install.sh

          for command in tmux-clip-paste tmux-continuum-default-server \
            tmux-continuum-save-gate; do
            [[ -L "$install_prefix/bin/$command" ]]
            /bin/bash -n "$install_prefix/bin/$command"
          done
          /bin/bash "$install_prefix/bin/tmux-clip-paste" --help >/dev/null
          TMUX= /bin/bash "$install_prefix/bin/tmux-continuum-default-server"
          /bin/bash "$install_prefix/bin/tmux-continuum-save-gate"

  required:
    name: Required
    if: ${{ always() }}
    needs: [shell, macos-bash32]
    runs-on: ubuntu-24.04
    env:
      SHELL_RESULT: ${{ needs.shell.result }}
      BASH32_RESULT: ${{ needs.macos-bash32.result }}
    steps:
      - name: Require all tmux-tools compatibility checks
        shell: bash
        run: |-
          printf 'Shared shell CI: %s\n' "$SHELL_RESULT"
          printf 'Stock macOS Bash 3.2: %s\n' "$BASH32_RESULT"

          test "$SHELL_RESULT" = success
          test "$BASH32_RESULT" = success

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@b97bd729afec784785bd01ebd43321225ef47bb7
